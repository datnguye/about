[project]
name = "context-engineering-blog-post"
version = "0.1.0"
description = "Code examples for Context Engineering blog post series"
authors = [
    {name = "Dat Nguyen", email = "datnguyen.it09@gmail.com"}
]
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "litellm>=1.75.8",
    "python-dotenv>=1.1.1",
    "pydantic>=2.11.7",
    "ruff>=0.12.9",
]

[project.optional-dependencies]
# AI/ML frameworks
agents = [
    "langchain>=0.3.27",
    "langchain-community>=0.3.27",
    "crewai>=0.98.12",
]

# RAG and vector databases
rag = [
    "chromadb>=0.5.24",
    "faiss-cpu>=1.9.0",
    "lightrag-hku>=0.0.6",
    "numpy>=2.0.0",
    "sentence-transformers>=3.0.1",
]

# Database and SQL
database = [
    "sqlalchemy>=2.0.43",
    "psycopg2-binary>=2.9.9",
    "duckdb>=1.1.3",
]

# MCP (Model Context Protocol)
mcp = [
    "mcp>=1.13.0",
    "mcp-server-time>=2025.8.4",
    "mcp-server-filesystem>=0.1.0",
    "mcp-server-sqlite>=0.1.0",
]

# Development tools
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.24.0",
    "black>=24.0.0",
    "mypy>=1.13.0",
]

# All dependencies for complete setup
all = [
    "context-engineering-blog-post[agents,rag,database,mcp,dev]"
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.ruff]
line-length = 88
target-version = "py313"

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "F",   # pyflakes
    "W",   # pycodestyle warnings
    "I",   # isort
    "N",   # pep8-naming
    "UP",  # pyupgrade
    "B",   # flake8-bugbear
    "A",   # flake8-builtins
    "C4",  # flake8-comprehensions
    "ISC", # flake8-implicit-str-concat
    "PIE", # flake8-pie
    "RSE", # flake8-raise
    "SIM", # flake8-simplify
    "TID", # flake8-tidy-imports
    "ARG", # flake8-unused-arguments
    "PTH", # flake8-use-pathlib
    "ERA", # eradicate
    "PGH", # pygrep-hooks
    "RUF", # ruff-specific rules
]
ignore = [
    "E501",  # line too long (handled by formatter)
    "T201",  # print statements are needed for demo scripts
    "B008",  # function calls in argument defaults
]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
skip-magic-trailing-comma = false

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
python_files = ["test_*.py", "*_test.py"]

[tool.mypy]
python_version = "3.13"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
disallow_incomplete_defs = true
check_untyped_defs = true
disallow_untyped_decorators = true