[project]
name = "memory-systems-demo"
version = "0.1.0"
description = "Memory Systems for LLMs - Code Examples for Context Engineering Deep Dive Part 5"
authors = [
    {name = "Dat Nguyen", email = "datnguyen.it09@gmail.com"}
]
readme = "README.md"
requires-python = ">=3.8"
dependencies = [
    "sentence-transformers>=2.2.0",
    "numpy>=1.21.0",
    "tiktoken>=0.4.0",
    "python-dotenv>=1.0.0",
    "litellm>=1.0.0",
]

[dependency-groups]
dev = [
    "ruff>=0.12.9",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.ruff]
line-length = 88
target-version = "py38"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "YTT", "BLE", "B", "A", "COM", "C4", "DTZ", "T10", "EM", "EXE", "FA", "ISC", "ICN", "G", "INP", "PIE", "T20", "PYI", "PT", "Q", "RSE", "RET", "SLF", "SLOT", "SIM", "TID", "TCH", "INT", "ARG", "PTH", "ERA", "PD", "PGH", "PL", "TRY", "FLY", "NPY", "PERF", "RUF"]
ignore = ["COM812", "ISC001"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
