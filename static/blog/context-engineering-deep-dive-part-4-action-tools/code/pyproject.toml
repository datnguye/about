[project]
name = "context-engineering-part-4-action-tools"
version = "0.1.0"
description = "Action Tools & Function Calling - Context Engineering Deep Dive Part 4"
authors = [
    {name = "Dat Nguyen", email = "datnguyen.it09@gmail.com"}
]
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "litellm>=1.75.8",
    "python-dotenv>=1.1.1",
    "pydantic>=2.11.7",
    "ruff>=0.12.9",
]

[project.optional-dependencies]
# Core AI/ML frameworks for agents and function calling
agents = [
    "langchain>=0.3.27",
    "langchain-community>=0.3.27",
]

# MCP (Model Context Protocol) for tool integration
mcp = [
    "mcp>=1.13.0",
    "mcp-server-time>=2025.8.4",
]

# Install all dependencies for complete Part 4 setup
all = [
    "context-engineering-part-4-action-tools[agents,mcp]"
]


[tool.ruff]
line-length = 88
target-version = "py313"

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "F",   # pyflakes
    "W",   # pycodestyle warnings
    "I",   # isort
    "N",   # pep8-naming
    "UP",  # pyupgrade
    "B",   # flake8-bugbear
    "A",   # flake8-builtins
    "C4",  # flake8-comprehensions
    "ISC", # flake8-implicit-str-concat
    "PIE", # flake8-pie
    "RSE", # flake8-raise
    "SIM", # flake8-simplify
    "TID", # flake8-tidy-imports
    "ARG", # flake8-unused-arguments
    "PTH", # flake8-use-pathlib
    "ERA", # eradicate
    "PGH", # pygrep-hooks
    "RUF", # ruff-specific rules
]
ignore = [
    "E501",  # line too long (handled by formatter)
    "T201",  # print statements are needed for demo scripts
    "B008",  # function calls in argument defaults
]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
skip-magic-trailing-comma = false

